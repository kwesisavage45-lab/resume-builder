<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraftResume - Free Resume & CV Builder</title>
    <!-- Favicon: drop your image in this folder named "logo.png" (also tries logo.svg / .jpg / .jpeg / .webp / .ico) -->
    <link rel="icon" id="site-favicon" href="logo.png">
    <script>
        (function () {
            var exts = ['png', 'svg', 'jpg', 'jpeg', 'webp', 'ico'];
            window.__logoSrc = null;
            window.__logoReady = new Promise(function (resolve) {
                (function tryNext(i) {
                    if (i >= exts.length) return resolve(null);
                    var src = 'logo.' + exts[i], img = new Image();
                    img.onload = function () {
                        window.__logoSrc = src;
                        var fav = document.getElementById('site-favicon');
                        if (fav) fav.href = src;
                        resolve(src);
                    };
                    img.onerror = function () { tryNext(i + 1); };
                    img.src = src;
                })(0);
            });
        })();
    </script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;500;600;700&family=Lora:wght@400;500;700&family=Montserrat:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            purple: '#7c3aed',
                            emerald: '#059669',
                            rose: '#e11d48',
                            amber: '#d97706',
                            dark: '#0f172a'
                        }
                    },
                    boxShadow: {
                        'neo': '4px 4px 0px 0px rgba(15, 23, 42, 1)',
                        'neo-sm': '2px 2px 0px 0px rgba(15, 23, 42, 1)',
                        'neo-lg': '6px 6px 0px 0px rgba(15, 23, 42, 1)',
                        'neo-dark': '4px 4px 0px 0px rgba(248, 250, 252, 1)',

    <style>
        /* Typography classes applied dynamically */
        .font-sans-inter { font-family: 'Inter', sans-serif; }
        .font-serif-merriweather { font-family: 'Merriweather', serif; }
        .font-mono-fira { font-family: 'Fira Code', monospace; }

        /* Print styling logic */
        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only-container {
                display: block !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .resume-paper {
                box-shadow: none !important;
                border: none !important;
                width: 100% !important;
                max-width: 100% !important;
                min-height: 100vh !important;
                padding: 0 !important;
                margin: 0 !important;
            }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
        }

        @media (max-width:1023px){.force-hide{display:none!important}}
        @media print{
            @page{margin:12mm}
            main{display:block!important;padding:0!important}
            #panel-editor,header{display:none!important}
            #panel-preview{display:block!important;position:static!important}
            .resume-paper{-webkit-print-color-adjust:exact;print-color-adjust:exact}
            #resume-render-target h2,#resume-render-target h3{break-after:avoid}
            #resume-render-target .space-y-4>div,#resume-render-target .space-y-3>div,#resume-render-target .space-y-2>div,.break-inside-avoid{break-inside:avoid}
        }
    .font-serif-playfair{font-family:'Playfair Display',serif}.font-pop{font-family:'Poppins',sans-serif}
        .font-lora{font-family:'Lora',serif}.font-mont{font-family:'Montserrat',sans-serif}.font-source{font-family:'Source Sans 3',sans-serif}.font-raleway{font-family:'Raleway',sans-serif}.font-space{font-family:'Space Grotesk',sans-serif}
        .tint h2{color:var(--ac)!important;border-color:var(--ac)!important}
        @media (max-width:1023px){body{padding-bottom:4.5rem}#toast-container{bottom:4.5rem!important}}
        @media print{.bleed{margin:0 0 1.5rem!important}#mbar{display:none!important}}
    </style>
</head>

                        </div>

    <!-- APP ENGINE LOGIC -->
    <script>

            personal: {

    <script>
    // ===== PATCH LAYER: fixes + new features =====
    const STORE_KEY = 'craftresume-v1';
    const FIELDS = {
        experience: ['jobTitle','company','dates','location','description'],
        education: ['degree','school','dates','details'],
        projects: ['title','link','description']
    };
    const LIST_RENDERERS = { experience:'renderExperienceFormList', education:'renderEducationFormList', projects:'renderProjectFormList' };
    const uid = k => k + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const escClone = o => JSON.parse(JSON.stringify(o), (k, v) => typeof v === 'string' ? esc(v) : v);

    function ensureShape() {
        const r = resumeState;
        r.config = Object.assign({showProjects:true, customOn:false, docType:'resume', template:'modern', font:'font-sans-inter', accentColor:'#2563eb', scale:1, spacing:'', tint:false}, r.config);
        if (!TPL_TYPE[r.config.template]) r.config.template = 'modern';
        r.config.docType = TPL_TYPE[r.config.template];
        r.personal = Object.assign({fullName:'',jobTitle:'',email:'',phone:'',location:'',website:'',summary:''}, r.personal);
        for (const k in FIELDS) r[k] = (Array.isArray(r[k]) ? r[k] : []).map(it => {
            const o = {id: (it && it.id) ? String(it.id) : uid(k)};
            FIELDS[k].forEach(f => o[f] = String((it && it[f]) || ''));
            return o;
        });
        r.skills = (Array.isArray(r.skills) ? r.skills : []).map(String);
        r.extras = Object.assign({languages:'', certifications:''}, r.extras); r.photo = typeof r.photo === 'string' ? r.photo : '';
    }

    function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify({state: resumeState, dark: document.documentElement.classList.contains('dark')})); } catch (e) {}
    }

    function syncExtras() {
        const l = document.getElementById('field-languages'), c = document.getElementById('field-certs');
        if (l && c) { resumeState.extras = { languages: l.value, certifications: c.value }; }
    }

    function extrasHTML(r) {
        return [['Languages', r.extras.languages], ['Certifications', r.extras.certifications]]
            .filter(b => b[1] && b[1].trim())
            .map(b => `<div class="mt-5 break-inside-avoid"><h2 class="text-xs font-black uppercase tracking-widest border-b-2 border-slate-900 pb-1 mb-2">${b[0]}</h2><ul class="text-xs text-slate-700 space-y-0.5">${b[1].split('\n').filter(l => l.trim()).map(l => `<li>${l.trim()}</li>`).join('')}</ul></div>`).join('');
    }

    // Safe render: escapes all user text before it reaches innerHTML
    function renderResume() {
        syncPersonalState(); syncExtras(); ensureShape();
        const real = resumeState;
        resumeState = escClone(real);
        if (real.config.showProjects === false) resumeState.projects = [];
        if (!real.config.customOn) resumeState.custom = [];
        try {
            const paper = document.getElementById('resume-paper'), target = document.getElementById('resume-render-target');
            paper.className = `resume-paper bg-white text-slate-900 border-4 border-slate-900 shadow-neo-lg p-8 md:p-10 transition-all min-h-[842px] ${real.config.font}`;
            const c = real.config.accentColor, t = real.config.template;
            target.innerHTML = renderByTpl(t, c) + (INLINE_EXTRAS.has(t) ? '' : extrasHTML(resumeState)) + customHTML(resumeState, c, t);
            target.style.zoom = real.config.scale || 1; applyAdv(real, target);
        } finally { resumeState = real; }
        document.querySelectorAll('[onclick^="setAccentColor"]').forEach(b => {
            const on = b.getAttribute('onclick').includes(real.config.accentColor);
            b.classList.toggle('ring-2', on); b.classList.toggle('ring-offset-2', on); b.classList.toggle('ring-blue-500', on);
        });
        const pick = document.getElementById('accent-custom'); if (pick) pick.value = real.config.accentColor;
        updateScore(); save();
    }

    // Wrap list renderers: escape values in form inputs + add move up/down
    function wrapList(key, containerId) {
        const name = LIST_RENDERERS[key], orig = window[name];
        window[name] = function () {
            const real = resumeState; resumeState = escClone(real);
            try { orig(); } finally { resumeState = real; }
            [...document.getElementById(containerId).children].forEach((card, i) => {
                const it = real[key][i]; if (!it) return;
                card.insertAdjacentHTML('afterbegin', `<div class="absolute top-2 right-9 flex gap-2 text-slate-500"><button onclick="moveItem('${key}','${it.id}',-1)" title="Move up" aria-label="Move up"><i class="fa-solid fa-arrow-up"></i></button><button onclick="moveItem('${key}','${it.id}',1)" title="Move down" aria-label="Move down"><i class="fa-solid fa-arrow-down"></i></button></div>`);
            });
        };
    }
    wrapList('experience','experience-container'); wrapList('education','education-container'); wrapList('projects','projects-container');

    function moveItem(key, id, d) {
        const a = resumeState[key], i = a.findIndex(x => x.id === id), j = i + d;
        if (i < 0 || j < 0 || j >= a.length) return;
        [a[i], a[j]] = [a[j], a[i]];
        window[LIST_RENDERERS[key]](); renderResume();
    }

    // Skills: no more broken quotes in onclick; supports "a, b, c"
    function renderSkillsBadges() {
        const c = document.getElementById('skills-badges-container'); c.innerHTML = '';
        resumeState.skills.forEach((s, i) => {
            const b = document.createElement('span');
            b.className = 'inline-flex items-center gap-1 px-2.5 py-1 bg-amber-300 border border-slate-900 font-bold text-xs text-slate-900 shadow-neo-sm';
            b.append(document.createTextNode(s));
            const x = document.createElement('button');
            x.className = 'hover:text-rose-600 ml-1'; x.setAttribute('aria-label', 'Remove ' + s);
            x.innerHTML = '<i class="fa-solid fa-xmark"></i>'; x.onclick = () => removeSkill(i);
            b.append(x); c.append(b);
        });
    }
    function removeSkill(i) { resumeState.skills.splice(i, 1); renderSkillsBadges(); renderResume(); }
    function addSkillFromInput() {
        const input = document.getElementById('skill-input');
        input.value.split(',').map(v => v.trim()).filter(Boolean).forEach(v => {
            if (!resumeState.skills.some(s => s.toLowerCase() === v.toLowerCase())) resumeState.skills.push(v);
        });
        input.value = ''; renderSkillsBadges(); renderResume();
    }

    function updateCustomizer() {
        resumeState.config.template = document.getElementById('config-template').value;
        resumeState.config.font = document.getElementById('config-font').value;
        resumeState.config.scale = parseFloat(document.getElementById('config-scale').value) || 1;
        renderResume();
    }

    function fillAll() {
        ensureShape();
        const p = resumeState.personal;
        for (const k in p) { const el = document.getElementById('field-' + k); if (el) el.value = p[k]; }
        document.getElementById('config-template').value = resumeState.config.template;
        document.getElementById('config-font').value = resumeState.config.font;
        document.getElementById('config-scale').value = String(resumeState.config.scale);
        document.getElementById('field-languages').value = resumeState.extras.languages;
        document.getElementById('field-certs').value = resumeState.extras.certifications;
        renderExperienceFormList(); renderEducationFormList(); renderProjectFormList(); renderSkillsBadges(); renderResume();
    }

    const origSample = loadSampleData;
    function loadSample() {
        origSample();
        resumeState.extras = { languages: 'English (Native)\nFrench (Intermediate)', certifications: 'AWS Certified Developer - Associate\nScrum Master (PSM I)' };
        resumeState.custom = [{title:'Volunteering', body:'Mentor, Code for Good Bootcamp (2021 - Present)\nOrganizer, Bay Area Open Source Meetup (2019 - 2022)'}, {title:'Awards', body:'Engineering Excellence Award, CloudScale Technologies (2023)\nHackathon Winner, TechCrunch Disrupt (2020)'}];
        fillAll();
    }
    function hasData() { const r = resumeState; return Object.values(r.personal).some(v => v) || r.experience.length || r.education.length || r.projects.length || r.skills.length; }
    function sampleBtn() { if (hasData() && !confirm('Replace your current resume with the sample data?')) return; loadSample(); }

    function confirmReset() {
        if (!confirm('Clear all resume fields?')) return;
        resumeState.personal = {fullName:'',jobTitle:'',email:'',phone:'',location:'',website:'',summary:''};
        resumeState.experience = []; resumeState.education = []; resumeState.projects = []; resumeState.skills = [];
        resumeState.extras = {languages:'', certifications:''}; resumeState.photo = ''; resumeState.custom = [];
        document.getElementById('skill-input').value = '';
        fillAll(); showToast('Form reset complete.');
    }

    function switchMobileTab(tab) {
        const ed = tab === 'editor';
        document.getElementById('panel-editor').classList.toggle('force-hide', !ed);
        document.getElementById('panel-preview').classList.toggle('hidden', ed);
        const on = 'px-3 py-1 font-bold text-xs bg-amber-400 text-slate-900 border border-slate-900 shadow-neo-sm', off = 'px-3 py-1 font-bold text-xs text-slate-700 dark:text-slate-200';
        document.getElementById('btn-tab-editor').className = ed ? on : off;
        document.getElementById('btn-tab-preview').className = ed ? off : on;
    }

    function toggleDarkMode() { document.documentElement.classList.toggle('dark'); save(); }

    function printResume() {
        const old = document.title; document.title = ((resumeState.personal.fullName || 'Resume').trim() + ' - Resume');
        window.print(); setTimeout(() => document.title = old, 500);
    }

    function copyText() {
        const r = resumeState, p = r.personal, L = [p.fullName, p.jobTitle, [p.email, p.phone, p.location, p.website].filter(Boolean).join(' | '), ''];
        if (p.summary) L.push('SUMMARY', p.summary, '');
        if (r.experience.length) { L.push('EXPERIENCE'); r.experience.forEach(e => L.push([e.jobTitle, e.company].filter(Boolean).join(' - ') + (e.dates ? ' (' + e.dates + ')' : ''), e.description, '')); }
        if (r.education.length) { L.push('EDUCATION'); r.education.forEach(e => L.push([e.degree, e.school, e.dates].filter(Boolean).join(', '))); L.push(''); }
        if (r.config.showProjects !== false && r.projects.length) { L.push('PROJECTS'); r.projects.forEach(e => L.push(e.title + (e.link ? ' - ' + e.link : ''), e.description, '')); }
        if (r.skills.length) L.push('SKILLS', r.skills.join(', '), '');
        if (r.extras.languages.trim()) L.push('LANGUAGES', r.extras.languages, '');
        if (r.extras.certifications.trim()) L.push('CERTIFICATIONS', r.extras.certifications);
        if (r.config.customOn) (r.custom || []).forEach(x => { if ((x.title || '').trim() || (x.body || '').trim()) L.push('', (x.title || 'ADDITIONAL').toUpperCase(), x.body); });
        const text = L.join('\n');
        const fb = () => { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); showToast('Plain text copied'); } catch (e) { showToast('Copy failed'); } t.remove(); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => showToast('Plain text copied'), fb); else fb();
    }

    function updateScore() {
        const r = resumeState, p = r.personal, tips = []; let s = 0;
        const chk = (ok, pts, tip) => { if (ok) s += pts; else tips.push(tip); };
        chk(p.fullName.trim(), 10, 'Add your name'); chk(p.jobTitle.trim(), 5, 'Add a job title');
        chk(p.email.trim() && p.phone.trim(), 10, 'Add both email and phone');
        chk(p.summary.trim().length >= 120, 15, 'Write a summary of 120+ characters');
        chk(r.experience.length, 15, 'Add work experience');
        chk(r.experience.reduce((n, e) => n + e.description.split('\n').filter(l => l.trim()).length, 0) >= 4, 15, 'Add at least 4 achievement lines');
        chk(r.education.length, 10, 'Add education'); chk(r.skills.length >= 5, 10, 'List 5+ skills');
        chk(r.projects.length || r.extras.certifications.trim() || r.extras.languages.trim(), 10, 'Add projects, certifications or languages');
        const el = document.getElementById('score-badge'); if (!el) return;
        el.textContent = 'Strength ' + s + '%'; el.title = tips.length ? tips.join('\n') : 'Looks complete';
        el.onclick = () => showToast(tips[0] || 'Looks complete!');
    }

    function injectUI() {
        const cls = 'px-3 py-2 text-xs font-bold bg-white dark:bg-slate-700 text-slate-900 dark:text-slate-100 border-2 border-slate-900 dark:border-slate-100 shadow-neo-sm hover:translate-x-[1px] hover:translate-y-[1px] transition-all';
        document.querySelector('header button[onclick="printResume()"]').insertAdjacentHTML('beforebegin',
            `<button onclick="copyText()" class="${cls}" title="Copy as plain text for application forms"><i class="fa-solid fa-copy md:mr-1"></i><span class="hidden md:inline">Copy text</span></button>`);
        document.getElementById('config-template').closest('.grid').insertAdjacentHTML('beforeend',
            `<div><label class="block text-xs font-extrabold uppercase mb-1">Text Size</label>
             <select id="config-scale" onchange="updateCustomizer()" class="w-full bg-slate-50 dark:bg-slate-900 border-2 border-slate-900 dark:border-slate-100 font-bold text-xs p-2">
             <option value="0.9">Small</option><option value="1">Medium</option><option value="1.1">Large</option></select></div>`);
        document.querySelector('[onclick^="setAccentColor"]').parentElement.insertAdjacentHTML('beforeend',
            `<input type="color" id="accent-custom" aria-label="Custom accent color" title="Custom color" class="w-6 h-6 p-0 border-2 border-slate-900 bg-transparent cursor-pointer" oninput="advColor(this.value)">`);
        const ta = 'w-full border-2 border-slate-900 dark:border-slate-100 bg-slate-50 dark:bg-slate-900 p-2 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-blue-500';
        document.getElementById('acc-skills').parentElement.insertAdjacentHTML('afterend',
            `<div class="bg-white dark:bg-slate-800 border-4 border-slate-900 dark:border-slate-100 shadow-neo dark:shadow-neo-dark overflow-hidden">
               <button onclick="toggleAccordion('acc-extras')" class="w-full p-4 bg-slate-100 dark:bg-slate-700 text-left font-black text-sm uppercase flex justify-between items-center border-b-2 border-slate-900 dark:border-slate-100">
                 <span><i class="fa-solid fa-certificate text-blue-600 dark:text-blue-400 mr-2"></i> 6. Languages & Certifications</span>
                 <i id="acc-extras-icon" class="fa-solid fa-chevron-down transition-transform"></i></button>
               <div id="acc-extras" class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3 hidden">
                 <div><label class="block text-xs font-bold uppercase mb-1">Languages (one per line)</label><textarea id="field-languages" rows="3" oninput="renderResume()" class="${ta}"></textarea></div>
                 <div><label class="block text-xs font-bold uppercase mb-1">Certifications (one per line)</label><textarea id="field-certs" rows="3" oninput="renderResume()" class="${ta}"></textarea></div>
               </div></div>`);
        document.querySelector('#panel-preview .no-print').insertAdjacentHTML('beforeend',
            `<button id="score-badge" class="text-xs font-bold bg-emerald-300 text-slate-900 px-2 py-0.5 border border-slate-900" title="">Strength</button>`);
        ['acc-personal','acc-experience','acc-education','acc-projects','acc-skills','acc-extras'].forEach(id => {
            document.getElementById(id + '-icon').style.transform = document.getElementById(id).classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        });
    }

    function initApp() {
        injectUI();
        let saved = null;
        try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) {}
        if (saved && saved.state && saved.state.personal) {
            resumeState = saved.state;
            if (saved.dark) document.documentElement.classList.add('dark');
            fillAll();
        } else { loadSample(); }
    }
    </script>

    <script>

    let _optType = null;
    function buildLayoutOptions(type) {
        if (_optType === type) return; _optType = type;
        $$('config-template').innerHTML = LAYOUTS[type].map(l => `<option value="${l[0]}">${l[1]}${l[2] ? ' 📷' : ''}</option>`).join('');
    }
    function buildFontOptions() { $$('config-font').innerHTML = FONTS.map(f => `<option value="${f[0]}">${f[1]}</option>`).join(''); }

    function updateCustomizer() {
        const c = resumeState.config, dt = $$('config-doctype').value;
        if (dt !== c.docType) { c.docType = dt; c.template = DEFAULT_TPL[dt]; showToast(dt === 'cv' ? 'CV layouts loaded' : 'Resume layouts loaded'); }
        else c.template = $$('config-template').value;
        c.font = $$('config-font').value; c.spacing = $$('adv-spacing').value; c.tint = $$('adv-tint').checked;
        c.scale = parseFloat($$('config-scale').value) || 1;
        renderResume();
    }
    function advColor(v) { resumeState.config.accentColor = v; renderResume(); }
    function applyAdv(real, target) {
        const c = real.config;
        target.style.lineHeight = c.spacing || ''; target.style.setProperty('--ac', c.accentColor); target.classList.toggle('tint', !!c.tint);
        buildLayoutOptions(c.docType);
        $$('config-doctype').value = c.docType; $$('config-template').value = c.template; $$('config-font').value = c.font;
        $$('adv-spacing').value = c.spacing || ''; $$('adv-tint').checked = !!c.tint;
        const th = $$('photo-thumb'); if (th) th.innerHTML = real.photo ? `<img src="${real.photo}" alt="Profile photo" class="w-full h-full object-cover">` : '<i class="fa-solid fa-user text-slate-400"></i>';
    }

    // ----- photo (free) -----
    function pickPhoto() { $$('photo-file').click(); }
    function removePhoto() { resumeState.photo = ''; renderResume(); }
    function onPhoto(file) {
        if (!file || !file.type.startsWith('image/')) return showToast('Please choose an image file');
        const rd = new FileReader();
        rd.onload = () => {
            const img = new Image();
            img.onerror = () => showToast('Could not read that image');
            img.onload = () => {
                const side = Math.min(img.width, img.height), cv = document.createElement('canvas'); cv.width = cv.height = 300;
                cv.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 300, 300);
                resumeState.photo = cv.toDataURL('image/jpeg', 0.85); renderResume(); showToast('Photo added');
            };
            img.src = rd.result;
        };
        rd.readAsDataURL(file);
    }

    // ----- shared template helpers (resumeState is the escaped copy while rendering) -----
    const nm = p => p.fullName || 'Your Name';
    const contact = p => [p.email, p.phone, p.location, p.website].filter(Boolean);
    const L = s => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
    const ulist = a => a.length ? `<ul class="text-xs space-y-0.5">${a.map(x => `<li>${x}</li>`).join('')}</ul>` : '';
    const H = {
        rule: (t, c) => `<h2 class="text-xs font-black uppercase tracking-widest pb-1 mb-2 border-b-2 border-slate-900">${t}</h2>`,
        bar: (t, c) => `<h2 class="text-xs font-black uppercase tracking-widest pl-2 mb-2 border-l-4" style="border-color:${c}">${t}</h2>`,
        center: (t, c) => `<h2 class="text-[11px] font-bold uppercase tracking-[0.25em] text-center pb-1 mb-3 border-b border-slate-400">${t}</h2>`,
        pill: (t, c) => `<h2 class="inline-block text-[11px] font-black uppercase tracking-widest px-2 py-0.5 mb-2" style="background:${c};color:#fff!important">${t}</h2>`,
        plain: (t, c) => `<h2 class="text-[11px] font-black uppercase tracking-widest text-slate-500 pb-1 mb-2 border-b border-slate-300">${t}</h2>`,
        under: (t, c) => `<h2 class="text-sm font-extrabold pb-1 mb-2 border-b-2" style="color:${c};border-color:${c}">${t}</h2>`,
        card: (t, c) => `<h2 class="text-xs font-black uppercase tracking-widest pb-1 mb-2 border-b-2 border-slate-900">${t}</h2>`
    };
    const mk = (style, c) => (t, b) => !b ? '' : style === 'card'
        ? `<section class="mb-4 border-2 border-slate-900 p-3" style="box-shadow:3px 3px 0 0 ${c}">${H.card(t, c)}${b}</section>`
        : `<section class="mb-5">${H[style](t, c)}${b}</section>`;
    const sec = mk('rule', '#0f172a');
    const sum = r => r.personal.summary ? `<p class="text-xs leading-relaxed text-slate-800">${r.personal.summary}</p>` : '';
    const pic = (r, cls, st = '') => r.photo ? `<img src="${r.photo}" alt="" class="${cls} object-cover shrink-0" style="${st}">` : '';
    const jobHead = e => `<div class="flex justify-between items-baseline gap-2"><h3 class="font-bold text-sm">${e.jobTitle || 'Job Title'}</h3><span class="text-[11px] font-semibold text-slate-500 whitespace-nowrap">${e.dates}</span></div><div class="text-xs font-semibold text-slate-600">${[e.company, e.location].filter(Boolean).join(' | ')}</div><p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line mt-1">${e.description}</p>`;
    const expL = r => r.experience.length ? `<div class="space-y-3">${r.experience.map(e => `<div class="break-inside-avoid">${jobHead(e)}</div>`).join('')}</div>` : '';
    const eduL = r => r.education.length ? `<div class="space-y-2">${r.education.map(e => `<div class="text-xs break-inside-avoid"><div class="font-bold">${e.degree}</div><div class="text-slate-700">${e.school}</div><div class="text-[11px] text-slate-500">${[e.dates, e.details].filter(Boolean).join(' · ')}</div></div>`).join('')}</div>` : '';
    const prjL = r => r.projects.length ? `<div class="space-y-2">${r.projects.map(p => `<div class="text-xs break-inside-avoid"><div class="flex justify-between gap-2"><span class="font-bold">${p.title}</span><span class="font-mono text-[10px] text-slate-500 break-all">${p.link}</span></div><p class="text-slate-700">${p.description}</p></div>`).join('')}</div>` : '';
    const chips = (r, c) => r.skills.length ? `<div class="flex flex-wrap gap-1.5">${r.skills.map(s => `<span class="px-2 py-0.5 text-xs font-bold text-white" style="background:${c}">${s}</span>`).join('')}</div>` : '';
    const skI = r => r.skills.length ? `<p class="text-xs text-slate-700 leading-relaxed">${r.skills.join(' · ')}</p>` : '';
    const sideBox = (t, b, c) => b ? `<div><h2 class="font-black uppercase tracking-widest mb-1 pb-1 border-b-2" style="border-color:${c}">${t}</h2>${b}</div>` : '';
    const contactDivs = p => contact(p).map(x => `<div class="break-words">${x}</div>`).join('');

    // CV-style rows: dates in a left column
    const rowsExp = r => r.experience.length ? `<div class="space-y-3">${r.experience.map(e => `<div class="grid grid-cols-12 gap-3 break-inside-avoid"><div class="col-span-12 sm:col-span-3 text-[11px] font-semibold text-slate-500">${e.dates}</div><div class="col-span-12 sm:col-span-9"><h3 class="font-bold text-sm">${e.jobTitle || 'Job Title'}</h3><div class="text-xs font-semibold text-slate-600">${[e.company, e.location].filter(Boolean).join(' | ')}</div><p class="text-xs text-slate-700 leading-relaxed whitespace-pre-line mt-1">${e.description}</p></div></div>`).join('')}</div>` : '';
    const rowsEdu = r => r.education.length ? `<div class="space-y-3">${r.education.map(e => `<div class="grid grid-cols-12 gap-3 break-inside-avoid"><div class="col-span-12 sm:col-span-3 text-[11px] font-semibold text-slate-500">${e.dates}</div><div class="col-span-12 sm:col-span-9 text-xs"><div class="font-bold text-sm">${e.degree}</div><div class="font-semibold text-slate-600">${e.school}</div><div class="text-slate-600">${e.details}</div></div></div>`).join('')}</div>` : '';
    const rowsPrj = r => r.projects.length ? `<div class="space-y-3">${r.projects.map(p => `<div class="grid grid-cols-12 gap-3 break-inside-avoid"><div class="col-span-12 sm:col-span-3 font-mono text-[10px] text-slate-500 break-all">${p.link}</div><div class="col-span-12 sm:col-span-9 text-xs"><div class="font-bold text-sm">${p.title}</div><p class="text-slate-700">${p.description}</p></div></div>`).join('')}</div>` : '';
    const cvBody = (r, s) => s('Profile', sum(r)) + s('Education', rowsEdu(r)) + s('Professional Experience', rowsExp(r)) + s('Selected Projects', rowsPrj(r)) + s('Skills', skI(r)) + s('Languages', ulist(L(r.extras.languages))) + s('Certifications', ulist(L(r.extras.certifications)));

    // ----- RESUME layouts -----
    function tplSimple(c) {
        const r = resumeState, p = r.personal;
        return `<div class="mb-5"><h1 class="text-3xl font-extrabold" style="color:${c}">${nm(p)}</h1><p class="text-sm font-semibold text-slate-600">${p.jobTitle}</p><p class="text-xs text-slate-500 mt-1 break-words">${contact(p).join(' · ')}</p></div>${sec('Profile', sum(r))}${sec('Experience', expL(r))}${sec('Education', eduL(r))}${sec('Projects', prjL(r))}${sec('Skills', chips(r, c))}`;
    }
    function tplBanner(c) {
        const r = resumeState, p = r.personal;
        return `<div class="bleed -m-8 md:-m-10 mb-6 p-8 md:p-10 text-white flex items-center gap-5" style="background:${c}">${pic(r, 'w-24 h-24 rounded-full border-4 border-white')}<div class="min-w-0"><h1 class="text-3xl font-extrabold leading-tight">${nm(p)}</h1><p class="text-sm font-semibold opacity-90">${p.jobTitle}</p><p class="text-xs opacity-90 mt-2 break-words">${contact(p).join(' · ')}</p></div></div>${sec('Profile', sum(r))}${sec('Experience', expL(r))}<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${sec('Education', eduL(r))}${sec('Skills', chips(r, '#0f172a'))}</div>${sec('Projects', prjL(r))}`;
    }
    function tplSidebar(c) {
        const r = resumeState, p = r.personal, wh = 'style="color:#fff!important;border-color:rgba(255,255,255,.5)!important"';
        return `<div class="grid grid-cols-12 gap-5"><aside class="col-span-12 sm:col-span-4 p-4 text-white flex flex-col gap-4 text-xs" style="background:${c}">${pic(r, 'w-24 h-24 rounded-full border-4 border-white mx-auto')}<div class="text-center sm:text-left"><h1 class="text-2xl font-extrabold leading-tight">${nm(p)}</h1><p class="font-semibold opacity-90">${p.jobTitle}</p></div><div class="space-y-1 break-words">${contact(p).map(x => `<div>${x}</div>`).join('')}</div>${r.skills.length ? `<div><h2 ${wh} class="font-black uppercase tracking-widest mb-1 border-b pb-1">Skills</h2><ul class="space-y-0.5">${r.skills.map(s => `<li>${s}</li>`).join('')}</ul></div>` : ''}</aside><div class="col-span-12 sm:col-span-8">${sec('Profile', sum(r))}${sec('Experience', expL(r))}${sec('Education', eduL(r))}${sec('Projects', prjL(r))}</div></div>`;
    }
    function tplTimeline(c) {
        const r = resumeState, p = r.personal;
        const tl = r.experience.length ? `<div class="border-l-2 pl-5 ml-1 space-y-4" style="border-color:${c}">${r.experience.map(e => `<div class="relative break-inside-avoid"><span class="absolute -left-[27px] top-1 w-3 h-3 rounded-full" style="background:${c}"></span>${jobHead(e)}</div>`).join('')}</div>` : '';
        return `<div class="flex items-center gap-4 mb-6">${pic(r, 'w-20 h-20 rounded-lg border-2 border-slate-900')}<div class="min-w-0"><h1 class="text-3xl font-extrabold" style="color:${c}">${nm(p)}</h1><p class="text-sm font-semibold text-slate-600">${p.jobTitle}</p><p class="text-xs text-slate-500 mt-1 break-words">${contact(p).join(' · ')}</p></div></div>${sec('Profile', sum(r))}${sec('Experience', tl)}<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${sec('Education', eduL(r))}${sec('Skills', chips(r, c))}</div>${sec('Projects', prjL(r))}`;
    }
    function tplSplit(c) {
        const r = resumeState, p = r.personal, s = mk('bar', c);
        return `<div class="grid grid-cols-12 gap-5"><div class="col-span-12 sm:col-span-8 order-2 sm:order-1"><h1 class="text-3xl font-extrabold leading-tight" style="color:${c}">${nm(p)}</h1><p class="text-sm font-semibold text-slate-600 mb-5">${p.jobTitle}</p>${s('Profile', sum(r))}${s('Experience', expL(r))}${s('Projects', prjL(r))}</div><aside class="col-span-12 sm:col-span-4 order-1 sm:order-2 bg-slate-100 p-4 text-xs space-y-4">${pic(r, 'w-24 h-24 rounded-full border-4 mx-auto', 'border-color:' + c)}${sideBox('Contact', contactDivs(p), c)}${sideBox('Education', eduL(r), c)}${sideBox('Skills', ulist(r.skills), c)}</aside></div>`;
    }
    function tplLightbar(c) {
        const r = resumeState, p = r.personal, s = mk('bar', c);
        return `<div class="grid grid-cols-12 gap-5"><aside class="col-span-12 sm:col-span-4 bg-slate-100 p-4 text-xs space-y-4 border-t-8" style="border-color:${c}">${pic(r, 'w-24 h-24 rounded-full border-4 border-white mx-auto')}${sideBox('Contact', contactDivs(p), c)}${sideBox('Skills', ulist(r.skills), c)}${sideBox('Education', eduL(r), c)}</aside><div class="col-span-12 sm:col-span-8"><h1 class="text-3xl font-extrabold leading-tight">${nm(p)}</h1><p class="text-sm font-bold uppercase tracking-wider mb-5" style="color:${c}">${p.jobTitle}</p>${s('Profile', sum(r))}${s('Experience', expL(r))}${s('Projects', prjL(r))}</div></div>`;
    }
    function tplBold(c) {
        const r = resumeState, p = r.personal, s = mk('pill', c);
        return `<div class="bleed -m-8 md:-m-10 mb-6"><div class="p-8 md:p-10 text-white flex items-center gap-5" style="background:#0f172a">${pic(r, 'w-24 h-24 rounded-md border-4', 'border-color:' + c)}<div class="min-w-0"><h1 class="text-3xl font-black uppercase tracking-tight leading-tight">${nm(p)}</h1><p class="text-sm font-bold uppercase tracking-widest text-amber-300">${p.jobTitle}</p><p class="text-xs text-slate-300 mt-2 break-words">${contact(p).join(' · ')}</p></div></div><div class="h-2" style="background:${c}"></div></div>${s('Profile', sum(r))}${s('Experience', expL(r))}<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${s('Education', eduL(r))}${s('Skills', chips(r, c))}</div>${s('Projects', prjL(r))}`;
    }
    function tplElegant(c) {

    }
    function tplCards(c) {
        const r = resumeState, p = r.personal, s = mk('card', '#0f172a');

    }
    function tplStripe(c) {
        const r = resumeState, p = r.personal, s = mk('rule', c);
        return `<div class="border-l-8 pl-5" style="border-color:${c}"><div class="flex items-center justify-between gap-4 mb-5"><div class="min-w-0"><h1 class="text-3xl font-extrabold leading-tight">${nm(p)}</h1><p class="text-sm font-bold uppercase tracking-wider" style="color:${c}">${p.jobTitle}</p><p class="text-xs text-slate-500 mt-1 break-words">${contact(p).join(' · ')}</p></div>${pic(r, 'w-24 h-24 rounded-lg border-2 border-slate-900')}</div>${s('Profile', sum(r))}${s('Experience', expL(r))}${s('Education', eduL(r))}${s('Projects', prjL(r))}${s('Skills', chips(r, c))}</div>`;
    }
    function tplMinimal(c) {
        const r = resumeState, p = r.personal, s = mk('plain', c);
        return `<div class="mb-5"><h1 class="text-2xl font-bold" style="color:${c}">${nm(p)}</h1><p class="text-sm text-slate-600">${p.jobTitle}</p><p class="text-xs text-slate-500 mt-1 break-words">${contact(p).join(' | ')}</p></div>${s('Summary', sum(r))}${s('Experience', expL(r))}${s('Education', eduL(r))}${s('Projects', prjL(r))}${s('Skills', skI(r))}`;
    }
    function tplTwotone(c) {
        const r = resumeState, p = r.personal, s = mk('under', c);
        return `<div class="flex flex-wrap justify-between items-end gap-3 pb-3 mb-5 border-b-4" style="border-color:${c}"><div class="min-w-0"><h1 class="text-3xl font-extrabold leading-tight">${nm(p)}</h1><p class="text-sm font-semibold" style="color:${c}">${p.jobTitle}</p></div><div class="text-xs text-slate-600 sm:text-right space-y-0.5 break-words">${contactDivs(p)}</div></div>${s('Profile', sum(r))}${s('Experience', expL(r))}<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${s('Education', eduL(r))}${s('Skills', chips(r, c))}</div>${s('Projects', prjL(r))}`;
    }

    // ----- CV layouts (education first, dates column, languages and certifications built in) -----
    function tplCvClassic(c) {
        const r = resumeState, p = r.personal, s = mk('center', c);
        return `<div class="text-center mb-5 pb-3 border-b-4 border-double border-slate-900">${pic(r, 'w-24 h-24 rounded-full mx-auto mb-3 border-2 border-slate-900')}<h1 class="text-3xl font-black uppercase tracking-[0.15em]" style="color:${c}">${nm(p)}</h1><p class="text-[11px] font-bold uppercase tracking-[0.3em] text-slate-500 mt-1">Curriculum Vitae</p><p class="text-sm font-semibold text-slate-700 mt-2">${p.jobTitle}</p><p class="text-xs text-slate-600 mt-1 break-words">${contact(p).join(' · ')}</p></div>${cvBody(r, s)}`;
    }
    function tplCvTwocol(c) {
        const r = resumeState, p = r.personal, s = mk('bar', c);
        return `<div class="flex items-center justify-between gap-4 mb-6 pb-4 border-b-2 border-slate-900"><div class="min-w-0"><p class="text-[11px] font-bold uppercase tracking-[0.3em] text-slate-500">Curriculum Vitae</p><h1 class="text-3xl font-extrabold leading-tight" style="color:${c}">${nm(p)}</h1><p class="text-sm font-semibold text-slate-600">${p.jobTitle}</p><p class="text-xs text-slate-500 mt-1 break-words">${contact(p).join(' · ')}</p></div>${pic(r, 'w-24 h-28 rounded-sm border-2 border-slate-900')}</div>${cvBody(r, s)}`;
    }
    function tplCvModern(c) {
        const r = resumeState, p = r.personal, s = mk('under', c);
        return `<div class="flex items-center gap-4 mb-6">${pic(r, 'w-24 h-24 rounded-full border-4', 'border-color:' + c)}<div class="min-w-0"><h1 class="text-3xl font-extrabold leading-tight">${nm(p)}</h1><p class="text-sm font-bold uppercase tracking-wider" style="color:${c}">${p.jobTitle}</p><p class="text-xs text-slate-500 mt-1 break-words">${contact(p).join(' · ')}</p></div></div>${s('Profile', sum(r))}${s('Education', eduL(r))}${s('Professional Experience', expL(r))}${s('Selected Projects', prjL(r))}${s('Skills', chips(r, c))}<div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6">${s('Languages', ulist(L(r.extras.languages)))}${s('Certifications', ulist(L(r.extras.certifications)))}</div>`;
    }
    function tplCvFormal(c) {
        const r = resumeState, p = r.personal, s = mk('rule', c);
        const rows = [['Name', p.fullName], ['Title', p.jobTitle], ['Email', p.email], ['Phone', p.phone], ['Address', p.location], ['Website', p.website]].filter(x => x[1])
            .map(x => `<tr><td class="font-bold text-slate-500 w-28 py-0.5 align-top">${x[0]}</td><td class="break-words">${x[1]}</td></tr>`).join('');
        return `<div class="flex justify-between items-start gap-4 mb-6"><div><h1 class="text-3xl font-black uppercase tracking-widest" style="color:${c}">Curriculum Vitae</h1><div class="h-1 w-24 mt-2" style="background:${c}"></div></div>${pic(r, 'w-24 h-28 border-2 border-slate-900')}</div><section class="mb-5">${H.rule('Personal Details', c)}<table class="text-xs w-full"><tbody>${rows}</tbody></table></section>${cvBody(r, s)}`;
    }
    function tplCvBanner(c) {
        const r = resumeState, p = r.personal, s = mk('pill', c);
        return `<div class="bleed -m-8 md:-m-10 mb-6 p-8 md:p-10 text-white flex items-center gap-5" style="background:${c}">${pic(r, 'w-24 h-24 rounded-full border-4 border-white')}<div class="min-w-0"><p class="text-[11px] font-bold uppercase tracking-[0.3em] opacity-80">Curriculum Vitae</p><h1 class="text-3xl font-extrabold leading-tight">${nm(p)}</h1><p class="text-sm font-semibold opacity-90">${p.jobTitle}</p><p class="text-xs opacity-90 mt-2 break-words">${contact(p).join(' · ')}</p></div></div>${cvBody(r, s)}`;

    async function downloadPDF() {
        await withBusy('Preparing your PDF...', async () => {
            renderResume();
            await Promise.all([
                needLib('h2i', () => window.htmlToImage, 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js'),

                fr.style.height = Math.max(H, PH) + 'px';

                const slices = []; let y = 0;

                    if (H - y <= lastCap) end = H;
                    else if (end < H) { let best = null; boxes.forEach(b => { if (b[0] < end - 1 && b[1] > end + 1 && b[0] > y + cap * 0.3) best = best === null ? b[0] : Math.min(best, b[0]); }); if (best !== null) end = best; }
                    if (end < H) boxes.forEach(b => { if (b[2] && b[1] <= end + 1 && b[1] > end - 70 && b[0] > y + cap * 0.3) end = Math.min(end, b[0]); });

    }

    function buildDocx(photoBytes) {
        const D = window.docx, r = resumeState, p = r.personal, cfg = r.config, cv = cfg.docType === 'cv', tpl = cfg.template;
        const narr = tpl === 'summary' || tpl === 'cv-summary', plainHead = narr || tpl === 'minimal' || tpl === 'cv-minimal';
        const ACC = (/^#[0-9a-f]{6}$/i.test(cfg.accentColor) ? cfg.accentColor.slice(1) : '2563EB').toUpperCase();
        const FONT = { 'font-serif-merriweather': 'Cambria', 'font-mono-fira': 'Consolas', 'font-serif-playfair': 'Georgia', 'font-lora': 'Georgia', 'font-mont': 'Arial', 'font-raleway': 'Arial', 'font-space': 'Arial' }[cfg.font] || 'Calibri';
        const K = cfg.scale || 1, S = n => Math.round(n * K), GREY = '475569', LIGHT = '64748B', W = 9638;
        const run = (text, o = {}) => new D.TextRun(Object.assign({ text: String(text), font: FONT, size: S(21) }, o));
        const P = (kids, o = {}) => new D.Paragraph(Object.assign({ children: kids, spacing: { after: 60 } }, o));
        const strip = s => String(s).replace(/^[•\-*·]\s*/, '');
        const out = [];
        const head = title => {
            if (narr) return;
            if (plainHead) return out.push(P([run(title.toUpperCase(), { bold: true, size: S(19), color: LIGHT })], { spacing: { before: 200, after: 60 }, keepNext: true }));
            out.push(P([run(title.toUpperCase(), { bold: true, size: S(22), color: ACC })], { spacing: { before: 220, after: 80 }, keepNext: true, border: { bottom: { style: D.BorderStyle.SINGLE, size: 8, color: ACC, space: 2 } } }));
        };
        const lines = L;
        const desc = txt => lines(txt).forEach(l => out.push(/^[•\-*·]\s*/.test(l) ? new D.Paragraph({ children: [run(strip(l))], bullet: { level: 0 }, spacing: { after: 30 } }) : P([run(l)])));
        const entry = (title, right, sub, d) => {
            out.push(P([run(title, { bold: true, size: S(22) }), new D.TextRun({ children: [new D.Tab(), right || ''], font: FONT, size: S(19), color: LIGHT })], { tabStops: [{ type: D.TabStopType.RIGHT, position: W }], spacing: { before: 100, after: 20 }, keepNext: true }));
            if (sub) out.push(P([run(sub, { italics: true, color: GREY, size: S(20) })], { spacing: { after: 40 }, keepNext: !!d }));
            desc(d);
        };

        // header (with photo when there is one)
        const left = [];
        if (cv) left.push(P([run('CURRICULUM VITAE', { bold: true, size: S(17), color: LIGHT, characterSpacing: 60 })], { spacing: { after: 20 } }));
        left.push(P([run(p.fullName || 'Your Name', { bold: true, size: S(56), color: ACC })], { spacing: { after: 40 } }));
        if (p.jobTitle) left.push(P([run(p.jobTitle, { size: S(26), color: GREY })], { spacing: { after: 40 } }));
        const ct = [p.email, p.phone, p.location, p.website].filter(Boolean);
        if (ct.length) left.push(P([run(ct.join('  |  '), { size: S(19), color: LIGHT })], { spacing: { after: 80 } }));
        if (photoBytes) {
            const u8 = photoBytes;
            const none = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' }, nb = { top: none, bottom: none, left: none, right: none };
            out.push(new D.Table({
                width: { size: W, type: D.WidthType.DXA }, columnWidths: [W - 1700, 1700], borders: Object.assign({ insideHorizontal: none, insideVertical: none }, nb),
                rows: [new D.TableRow({ children: [
                    new D.TableCell({ children: left, width: { size: W - 1700, type: D.WidthType.DXA }, borders: nb }),
                    new D.TableCell({ children: [P([new D.ImageRun({ data: u8, type: 'png', transformation: { width: 96, height: 96 } })], { alignment: D.AlignmentType.RIGHT })], width: { size: 1700, type: D.WidthType.DXA }, borders: nb })
                ] })]
            }));
        } else out.push(...left);

        if (narr) {
            narrative(r).forEach(t => out.push(P([run(t)], { spacing: { after: 140, line: 300 } })));
        } else {
            const sProfile = () => { if (p.summary && p.summary.trim()) { head('Profile'); lines(p.summary).forEach(l => out.push(P([run(l)]))); } };
            const sExp = () => { if (!r.experience.length) return; head(cv ? 'Professional Experience' : 'Experience'); r.experience.forEach(e => entry(e.jobTitle || 'Job Title', e.dates, [e.company, e.location].filter(Boolean).join(' | '), e.description)); };
            const sEdu = () => { if (!r.education.length) return; head('Education'); r.education.forEach(e => entry(e.degree || 'Degree', e.dates, e.school, e.details)); };
            const sPrj = () => { if (!r.projects.length || cfg.showProjects === false) return; head(cv ? 'Selected Projects' : 'Projects'); r.projects.forEach(x => entry(x.title || 'Project', x.link, '', x.description)); };
            const sSkills = () => { if (r.skills.length) { head('Skills'); out.push(P([run(r.skills.join('  ·  '))])); } };
            const sExtra = () => { [['Languages', r.extras.languages], ['Certifications', r.extras.certifications]].forEach(x => { const ls = lines(x[1]); if (ls.length) { head(x[0]); ls.forEach(l => out.push(P([run(l)], { spacing: { after: 20 } }))); } }); };
            const sCustom = () => { if (!cfg.customOn) return; (r.custom || []).forEach(x => { const t = String(x.title || '').trim(), ls = lines(x.body); if (!ls.length) return; head(t || 'Additional'); ls.length > 1 ? ls.forEach(l => out.push(new D.Paragraph({ children: [run(strip(l))], bullet: { level: 0 }, spacing: { after: 30 } }))) : ls.forEach(l => out.push(P([run(l)]))); }); };
            (cv ? [sProfile, sEdu, sExp, sPrj, sSkills, sExtra, sCustom] : [sProfile, sExp, sEdu, sPrj, sSkills, sExtra, sCustom]).forEach(f => f());
        }
        return new D.Document({
            creator: 'CraftResume', title: (p.fullName || 'My') + (cv ? ' - CV' : ' - Resume'),
            styles: { default: { document: { run: { font: FONT, size: S(21) } } } },
            sections: [{ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1000, right: 1134, bottom: 1000, left: 1134 } } }, children: out }]
        });
    }
    function photoToPng(src) {
        return new Promise(res => {
            if (!src) return res(null);
            const im = new Image();
            im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 300; c.getContext('2d').drawImage(im, 0, 0, 300, 300); c.toBlob(b => b ? b.arrayBuffer().then(a => res(new Uint8Array(a)), () => res(null)) : res(null), 'image/png'); };
            im.onerror = () => res(null); im.src = src;
        });
    }
    async function downloadWord() {
        await withBusy('Preparing your Word file...', async () => {
            renderResume();
            await needLib('docx', () => window.docx, 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js');
            const blob = await window.docx.Packer.toBlob(buildDocx(await photoToPng(resumeState.photo)));
            saveBlob(blob, fileBase() + '.docx');
        });
    }
    </script>
<script>
        // Swap the default icon for logo.* if one exists in this folder
        window.__logoReady.then(function (src) {
            if (!src) return;
            var img = document.getElementById('brand-logo-img');
            img.src = src;
            img.classList.remove('hidden');
            document.getElementById('brand-logo-icon').classList.add('hidden');
            var box = document.getElementById('brand-logo');
            box.classList.remove('bg-amber-400', 'p-2', 'border-2', 'border-slate-900', 'shadow-neo-sm', 'overflow-hidden');
            box.classList.add('bg-transparent');
        });
    </script>
